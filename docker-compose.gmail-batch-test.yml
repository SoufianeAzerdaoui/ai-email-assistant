name: mailflow-gmail-batch-http-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mailflow_gmail_batch_test
      POSTGRES_USER: mailflow_gmail_batch_test
      POSTGRES_PASSWORD: ${GMAIL_BATCH_TEST_DB_PASSWORD:?Set GMAIL_BATCH_TEST_DB_PASSWORD}
    ports:
      - target: 5432
        published: "55432"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - gmail_batch_postgres_data:/var/lib/postgresql/data
    networks:
      - gmail-batch-test
      - gmail-batch-host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow_gmail_batch_test -d mailflow_gmail_batch_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: "no"

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mailflow_gmail_batch_test:${GMAIL_BATCH_TEST_DB_PASSWORD:?Set GMAIL_BATCH_TEST_DB_PASSWORD}@postgres-test:5432/mailflow_gmail_batch_test
      WEBHOOK_SECRET: ${GMAIL_BATCH_TEST_WEBHOOK_SECRET:?Set GMAIL_BATCH_TEST_WEBHOOK_SECRET}
      JWT_SECRET: ${GMAIL_BATCH_TEST_JWT_SECRET:?Set GMAIL_BATCH_TEST_JWT_SECRET}
      JWT_EXPIRE_MINUTES: "60"
      N8N_WEBHOOK_SECRET: ${GMAIL_BATCH_TEST_N8N_SECRET:?Set GMAIL_BATCH_TEST_N8N_SECRET}
      N8N_DRAFT_WEBHOOK_URL: http://n8n-test:5678/webhook-disabled/draft-generation
      N8N_GMAIL_SEND_WEBHOOK_URL: http://n8n-test:5678/webhook-disabled/gmail-send
    ports:
      - target: 8000
        published: "18000"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - gmail-batch-test
      - gmail-batch-host
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: "no"

  n8n-test:
    image: docker.n8n.io/n8nio/n8n:2.43.6
    init: true
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:15679
      WEBHOOK_URL: http://localhost:15679
      N8N_ENCRYPTION_KEY: ${GMAIL_BATCH_TEST_N8N_ENCRYPTION_KEY:?Set GMAIL_BATCH_TEST_N8N_ENCRYPTION_KEY}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GMAIL_BATCH_TEST_BACKEND_URL: http://backend-test:8000
      GMAIL_BATCH_TEST_WEBHOOK_SECRET: ${GMAIL_BATCH_TEST_WEBHOOK_SECRET:?Set GMAIL_BATCH_TEST_WEBHOOK_SECRET}
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    ports:
      - target: 5678
        published: "15679"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - gmail_batch_n8n_data:/home/node/.n8n
    depends_on:
      backend-test:
        condition: service_healthy
    networks:
      - gmail-batch-test
      - gmail-batch-host
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:5678/healthz').then(response =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: "no"

networks:
  gmail-batch-test:
    internal: true
  gmail-batch-host:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"

volumes:
  gmail_batch_postgres_data:
  gmail_batch_n8n_data:
